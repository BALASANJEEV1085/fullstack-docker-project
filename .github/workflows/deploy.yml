name: Build and Deploy Fullstack Docker Project to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fullstack-docker-project
  INSTANCE_ID: i-07cf6ef3634ea75ea
  SECRETS_MANAGER_ID: deptic/fullstack-docker-project/secrets
  PUBLIC_URL: http://35.154.239.162

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.15'

      - name: Run backend tests
        working-directory: backend
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: /api
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (diagnostics)
        run: |
          set -x
          docker build -t fullstack-app:ci .
          docker images fullstack-app:ci

      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Login to Amazon ECR
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Compute image URI and push
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "IMAGE_URI=$FULL_IMAGE" >> "$GITHUB_ENV"
          docker tag fullstack-app:ci "$FULL_IMAGE:latest"
          docker tag fullstack-app:ci "$FULL_IMAGE:${GITHUB_SHA::8}"
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${GITHUB_SHA::8}"

      - name: Fetch approved runtime secret and deploy to EC2 via SSM
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          REGION="$AWS_REGION"
          INSTANCE="$INSTANCE_ID"
          ECR_REGISTRY_V="$ECR_REGISTRY"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          POSTGRES_PASSWORD_VALUE=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRETS_MANAGER_ID" \
            --region "$REGION" \
            --query SecretString --output text | python3 -c "import sys,json;print(json.load(sys.stdin)['POSTGRES_PASSWORD'])")

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY_V",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD_VALUE -e PORT=8080 -e REDIS_HOST=redis -e POSTGRES_HOST=postgres -e POSTGRES_USER=postgres -e POSTGRES_DATABASE=postgres -e REQUEST_ORIGIN=$PUBLIC_URL $IMAGE_URI",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy fullstack app latest image" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --instance-id "$INSTANCE" \
            --command-id "$COMMAND_ID" \
            --region "$REGION"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE" \
            --region "$REGION" \
            --query "{Status:Status,Output:Output,Error:StandardErrorContent}" \
            --output text

      - name: Verify deployment (health check must return HTTP 200)
        run: |
          for i in $(seq 1 15); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" || true)
            echo "Attempt $i: HTTP $HTTP_CODE from $PUBLIC_URL"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed: $PUBLIC_URL returned 200"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: $PUBLIC_URL did not return HTTP 200"
          exit 1