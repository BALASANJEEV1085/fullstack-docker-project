name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fullstack-docker-project
  INSTANCE_ID: i-07cf6ef3634ea75ea
  PUBLIC_URL: http://35.154.239.162
  TARGET_PORT: "80"

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build context diagnostics
        run: |
          set -e
          echo "=== Repository layout ==="
          ls -la
          echo "=== Dockerfile present at: . ==="
          head -n 5 Dockerfile
          echo "=== Go module ==="
          cat backend/go.mod
          echo "=== Node project ==="
          cat frontend/package.json

      - name: Configure AWS credentials
        run: |
          set -e
          export AWS_DEFAULT_REGION=ap-south-1
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          set -e
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          AWS_REGION="ap-south-1"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image
        run: |
          set -e
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          ECR_REPOSITORY="fullstack-docker-project"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" .

      - name: Push Docker image to ECR
        run: |
          set -e
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          ECR_REPOSITORY="fullstack-docker-project"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          REGION="ap-south-1"
          INSTANCE_ID="i-07cf6ef3634ea75ea"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          ECR_REPOSITORY="fullstack-docker-project"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fullstack-docker-project:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fullstack-docker-project:latest",
              "docker ps | grep app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $ECR_REPOSITORY" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM command id: $COMMAND_ID"
          echo "Waiting for SSM command to complete..."
          aws ssm wait command-executed \
            --instance-id "$INSTANCE_ID" \
            --command-id "$COMMAND_ID" \
            --region "$REGION"

          echo "=== SSM command output ==="
          aws ssm get-command-invocation \
            --instance-id "$INSTANCE_ID" \
            --command-id "$COMMAND_ID" \
            --region "$REGION" \
            --query "[Status,StatusDetails,StandardOutputContent,StandardErrorContent]" \
            --output text

      - name: Wait for application to become healthy
        run: |
          set -e
          TARGET_URL="http://35.154.239.162"
          echo "Probing $TARGET_URL ..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$TARGET_URL" || true)
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Deployment verified: $TARGET_URL returned HTTP 200"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: $TARGET_URL never returned HTTP 200"
          exit 1