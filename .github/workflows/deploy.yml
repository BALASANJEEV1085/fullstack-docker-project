name: Build and Deploy Fullstack Docker Project to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fullstack-docker-project
  INSTANCE_ID: i-07cf6ef3634ea75ea
  SECRETS_MANAGER_ID: deptic/fullstack-docker-project/secrets
  PUBLIC_URL: http://35.154.239.162
  CONTAINER_PORT: '80'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.15'

      - name: Run backend tests
        working-directory: backend
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: /api
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (diagnostics)
        run: |
          set -x
          docker build -t fullstack-app:ci .
          docker images fullstack-app:ci

      - name: Configure AWS credentials (static)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Login to Amazon ECR
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Compute image URI and push
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "IMAGE_URI=$FULL_IMAGE" >> "$GITHUB_ENV"
          docker tag fullstack-app:ci "$FULL_IMAGE:latest"
          docker tag fullstack-app:ci "$FULL_IMAGE:${GITHUB_SHA::8}"
          docker push "$FULL_IMAGE:latest"
          docker push "$FULL_IMAGE:${GITHUB_SHA::8}"

      - name: Fetch approved runtime secret and deploy to EC2 via SSM
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          REGION="$AWS_REGION"
          INSTANCE="$INSTANCE_ID"
          ECR_REGISTRY_V="$ECR_REGISTRY"
          IMAGE_URI="$IMAGE_URI"
          PUBLIC_URL_V="$PUBLIC_URL"

          POSTGRES_PASSWORD_VALUE=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRETS_MANAGER_ID" \
            --region "$REGION" \
            --query SecretString --output text | python3 -c "import sys,json;print(json.load(sys.stdin)['POSTGRES_PASSWORD'])")

          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY_V",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD_VALUE -e PORT=8080 -e REDIS_HOST=redis -e POSTGRES_HOST=postgres -e POSTGRES_USER=postgres -e POSTGRES_DATABASE=postgres -e REQUEST_ORIGIN=$PUBLIC_URL_V $IMAGE_URI",
              "sleep 15",
              "docker ps --filter name=app",
              "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1/ || exit 1"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy fullstack-docker-project ${GITHUB_SHA::8}" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM command id: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --region "$REGION" \
              --query "Status" --output text)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" --region "$REGION" --query "{Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output text
              exit 1
            fi
            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not succeed"
            exit 1
          fi

      - name: Health check deployment
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment healthy at $PUBLIC_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed; last status: $CODE"
          exit 1

      - name: Verify API through reverse proxy
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/ping" || true)
          echo "API via nginx: HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "API health check failed"
            exit 1
          fi