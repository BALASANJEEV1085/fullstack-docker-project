name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: fullstack-docker-project
  INSTANCE_ID: i-07cf6ef3634ea75ea
  PUBLIC_IP: 35.154.239.162
  TARGET_PORT: "80"
  DOCKERFILE_PATH: .

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build context diagnostics
        run: |
          set -e
          echo "=== Repository layout ==="
          ls -la
          echo "=== Dockerfile present at: ${{ env.DOCKERFILE_PATH }} ==="
          head -n 5 Dockerfile
          echo "=== Go module ==="
          cat backend/go.mod
          echo "=== Node project ==="
          cat frontend/package.json

      - name: Configure AWS credentials (env vars)
        run: |
          set -e
          echo "AWS_REGION=$AWS_REGION" >> "$GITHUB_ENV"
          aws sts get-caller-identity || true

      - name: Login to Amazon ECR
        run: |
          set -e
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build Docker image
        run: |
          set -e
          FULL_IMAGE="759204735992.dkr.ecr.ap-south-1.amazonaws.com/fullstack-docker-project"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" .
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"

      - name: Push Docker image to ECR
        run: |
          set -e
          FULL_IMAGE="759204735992.dkr.ecr.ap-south-1.amazonaws.com/fullstack-docker-project"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          REGION="ap-south-1"
          INSTANCE_ID="i-07cf6ef3634ea75ea"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          REPO="fullstack-docker-project"
          FULL_IMAGE="$ECR_REGISTRY/$REPO:latest"

          # The runtime image bundles frontend (nginx:80) and backend (8080),
          # with nginx proxying /api -> 127.0.0.1:8080, so a single container is needed.
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fullstack-docker-project:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fullstack-docker-project:latest",
              "docker ps | grep app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $REPO" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $COMMAND_ID"

          # Wait for the command to complete
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "Status" --output text)
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 5
          done
          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not succeed"
            exit 1
          fi

      - name: Verify deployment health (HTTP 200)
        run: |
          set -e
          URL="http://35.154.239.162"
          echo "Verifying health at $URL"
          CODE=$(curl -s -o /tmp/health-body.txt -w "%{http_code}" --max-time 30 "$URL" || echo "000")
          echo "HTTP status code: $CODE"
          echo "--- response body (first 20 lines) ---"
          head -n 20 /tmp/health-body.txt || true
          if [ "$CODE" != "200" ]; then
            echo "Health check failed: expected HTTP 200, got $CODE"
            exit 1
          fi
          echo "Health check passed: HTTP 200 from $URL"