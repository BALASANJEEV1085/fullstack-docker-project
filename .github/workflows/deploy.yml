name: Build and Deploy Fullstack Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: fullstack-docker-project
  IMAGE_TAG: latest

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.16'
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        working-directory: backend
        run: go test ./...

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (static, direct CLI)
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region ap-south-1
          echo AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} >> $GITHUB_ENV
          echo AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: |
          PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::$PASSWORD"
          echo "$PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build backend image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:$IMAGE_TAG" -t "$FULL_IMAGE:${{ github.sha }}" backend
          docker image inspect "$FULL_IMAGE:$IMAGE_TAG"

      - name: Push image to ECR
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:${{ github.sha }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials
        run: |
          echo AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} >> $GITHUB_ENV
          echo AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} >> $GITHUB_ENV

      - name: Fetch DB password from Secrets Manager
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "deptic/fullstack-docker-project/secrets" \
            --region ap-south-1 \
            --query SecretString --output text)
          echo "::add-mask::$SECRET"
          echo "SECRET_JSON<<EOF" >> $GITHUB_ENV
          echo "$SECRET" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Deploy image to EC2 via SSM
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          REGION="ap-south-1"
          INSTANCE_ID="i-07e7a00d63a659dff"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker pull ${FULL_IMAGE}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:8080 --name app -e POSTGRES_PASSWORD='\${POSTGRES_PASSWORD}' -e PORT=8080 ${FULL_IMAGE}"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --query "[Status,StatusDetails]" --output text

      - name: Health check (must return HTTP 200)
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://3.7.216.93/ping || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: did not receive HTTP 200 from http://3.7.216.93/ping"
          exit 1