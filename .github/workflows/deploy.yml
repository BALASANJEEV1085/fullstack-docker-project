name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: fullstack-docker-project
  INSTANCE_ID: i-07cf6ef3634ea75ea
  PUBLIC_IP: 35.154.239.162
  TARGET_PORT: "80"
  DOCKERFILE_PATH: .

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build context diagnostics
        run: |
          set -e
          echo "=== Repository layout ==="
          ls -la
          echo "=== Dockerfile present at: . ==="
          head -n 5 Dockerfile
          echo "=== Go module ==="
          cat backend/go.mod
          echo "=== Node project ==="
          cat frontend/package.json

      - name: Configure AWS credentials (env vars)
        run: |
          set -e
          aws sts get-caller-identity || true

      - name: Login to Amazon ECR
        run: |
          set -e
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image
        run: |
          set -e
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          ECR_REPOSITORY="fullstack-docker-project"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" .
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"

      - name: Push Docker image to ECR
        run: |
          set -e
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          ECR_REPOSITORY="fullstack-docker-project"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          REGION="ap-south-1"
          INSTANCE_ID="i-07cf6ef3634ea75ea"
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          REPO="fullstack-docker-project"
          FULL_IMAGE="$ECR_REGISTRY/$REPO:latest"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fullstack-docker-project:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fullstack-docker-project:latest",
              "docker ps | grep app"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $REPO" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $COMMAND_ID"

          echo "Waiting for SSM command to finish..."
          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" --output text || echo "Pending")
            echo "Attempt $i status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "SSM command did not succeed"
                exit 1
                ;;
            esac
            sleep 10
          done

          FINAL_STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --query "CommandInvocations[0].Status" --output text)
          if [ "$FINAL_STATUS" != "Success" ]; then
            echo "Deployment failed with status: $FINAL_STATUS"
            exit 1
          fi

      - name: Health check (HTTP 200 required)
        run: |
          set -e
          URL="http://35.154.239.162"
          echo "Checking health at $URL"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed (HTTP 200)"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: did not receive HTTP 200 from $URL"
          exit 1